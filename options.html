<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <title>Screen-to-Dispatch Settings</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      color: #111827;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #6b7280;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    #status {
      margin-top: 15px;
      color: #16a34a;
    }
  </style>
</head>

<body>
  <h1>Screen-to-Dispatch Settings</h1>

  <p class="description">
    Configure the email address that identifies the person submitting
    requests and the endpoint used to deliver requests.
  </p>

  <label for="userEmail">
    Your email
  </label>

  <input
    id="userEmail"
    type="email"
    placeholder="sara@prospectrdigital.com"
  >

  <label for="dispatchEndpoint">
    Dispatch email endpoint
  </label>

  <input
    id="dispatchEndpoint"
    type="url"
    placeholder="https://your-worker.example.workers.dev"
  >

  <button id="save">
    Save Settings
  </button>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
